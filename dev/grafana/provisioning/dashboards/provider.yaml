    orgId: 1
    folder: Dashboard Render SDK G POC
    folderUid: grsdk-phase0-poc-folder
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
