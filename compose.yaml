name: dashboard-render-sdk-g-poc

services:
  dev:
    image: dashboard-render-sdk-g-poc-dev:local
    build:
      context: .
      dockerfile: dev/container/Dockerfile
      args:
        PLAYWRIGHT_VERSION: "1.56.1"
    init: true
    working_dir: /workspace
    environment:
      HOME: /tmp/poc-home
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      POC_GRAFANA_PROXY_TARGET: http://grafana:3000
      POC_TEXT_PANEL_EXPERIMENT: "1"
      POC_TESTDATA_DATASOURCE_EXPERIMENT: "1"
      POC_VITE_HOST: 0.0.0.0
      GRAFANA_SOURCE_DIR: /workspace/.grafana-source/grafana-v13.2.3
      YARN_GLOBAL_FOLDER: /var/cache/yarn
    volumes:
      - .:/workspace
      - poc-node-modules:/workspace/node_modules
      - poc-yarn-cache:/var/cache/yarn
    ports:
      - "127.0.0.1:5173:5173"
    shm_size: 1gb
    networks:
      - dashboard-render-sdk-g-poc
    depends_on:
      grafana:
        condition: service_healthy
    command:
      - yarn
      - workspace
      - "@dashboard-render-sdk-g/poc-host"
      - dev

  grafana:
    extends:
      file: dev/grafana/compose.yaml
      service: grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dev/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./dev/grafana/provisioning/dashboards/provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./dev/grafana/provisioning/dashboards/grsdk-phase0-poc.json:/var/lib/grafana/dashboards/grsdk-phase0-poc.json:ro
      - ./dev/grafana/provisioning/dashboards/grsdk-phase0-poc-alt.json:/var/lib/grafana/dashboards/grsdk-phase0-poc-alt.json:ro
    networks:
      - dashboard-render-sdk-g-poc

volumes:
  grafana-data:
  poc-node-modules:
  poc-yarn-cache:

networks:
  dashboard-render-sdk-g-poc:
    name: dashboard-render-sdk-g-poc
