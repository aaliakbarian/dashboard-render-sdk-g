name: dashboard-render-sdk-g-standalone-demo

services:
  proxy:
    image: nginx:1.30.5-alpine3.24
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      host:
        condition: service_healthy
      grafana:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24

  host:
    build:
      context: ../..
      dockerfile: demo/standalone/host.Dockerfile
    init: true
    working_dir: /workspace
    environment:
      HOME: /tmp/poc-home
      GRAFANA_SOURCE_DIR: /workspace/.grafana-source/grafana-v13.2.3
      YARN_GLOBAL_FOLDER: /var/cache/yarn
    volumes:
      - ../..:/workspace
      - demo-node-modules:/workspace/node_modules
      - demo-yarn-cache:/var/cache/yarn
    command:
      - sh
      - -ec
      - >-
        test -d "$${GRAFANA_SOURCE_DIR}/.git" &&
        yarn install --immutable &&
        yarn build:provider-13 &&
        yarn workspace @dashboard-render-sdk-g/standalone-demo build &&
        exec yarn workspace @dashboard-render-sdk-g/standalone-demo preview
    healthcheck:
      test: [CMD-SHELL, "node -e \"fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start-dev, --import-realm]
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_HOSTNAME: http://localhost:8088/keycloak
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-demo-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-development-only-keycloak-admin}
    volumes:
      - demo-keycloak-data:/opt/keycloak/data
      - ./keycloak/dashboard-render-sdk-g-demo-realm.json:/opt/keycloak/data/import/dashboard-render-sdk-g-demo-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /keycloak/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r response <&3; [[ "$$response" == *" 200 "* ]]'
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  grafana:
    image: grafana/grafana:13.2.3@sha256:d84563330dc9d2fd2bc096d0fb96021b5319c75bf6ed555566709998e823dec4
    platform: linux/amd64
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-demo-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-development-only-grafana-admin}
      GF_SERVER_ROOT_URL: http://localhost:8088/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_LOGIN_COOKIE_NAME: standalone_demo_grafana_session
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak demo
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      # Local public fixture, matched by the imported confidential client.
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: development-only-grafana-client
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://localhost:8088/keycloak/realms/dashboard-render-sdk-g-demo/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/keycloak/realms/dashboard-render-sdk-g-demo/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/keycloak/realms/dashboard-render-sdk-g-demo/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"
      # Grafana clears its cookie and appends its own ID-token hint. The logout
      # client must therefore be grafana, independently of the SPA client.
      GF_AUTH_SIGNOUT_REDIRECT_URL: http://localhost:8088/keycloak/realms/dashboard-render-sdk-g-demo/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=http%3A%2F%2Flocalhost%3A8088%2F
    volumes:
      - demo-grafana-data:/var/lib/grafana
      - ../../dev/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../dev/grafana/provisioning/dashboards/provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ../../dev/grafana/provisioning/dashboards/drsdk-g-phase2-visualizations.json:/var/lib/grafana/dashboards/drsdk-g-phase2-visualizations.json:ro
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

volumes:
  demo-node-modules:
  demo-yarn-cache:
  demo-keycloak-data:
  demo-grafana-data:
